# Builds the pfSense package and attaches it to the GitHub Release.
#
# GitHub owns the version: publishing a Release with tag vX.Y.Z (or X.Y.Z)
# builds THAT version (package file name, `wolscheduler -V`, info.xml).
# Nothing is committed back.
#
# Manually (Actions -> Release package -> Run workflow): rebuilds the package
# of an already published Release, given its tag.

name: Release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the Release that receives the package (e.g. v1.2.3)"
        required: true

permissions:
  contents: write     # attach files to the Release

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  version:
    name: Version from the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not an X.Y.Z version, e.g. v1.2.3."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version $version (tag $TAG)"

  package:
    name: ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      WOL_VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Build the package
        run: make package ARCH=${{ matrix.arch }}

      - name: Checksums
        run: |
          make checksums
          ls -la dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            dist/pfSense-pkg-wolscheduler-*.tar.gz \
            dist/pfSense-pkg-wolscheduler-*.tar.gz.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
